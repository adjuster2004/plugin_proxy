<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; padding: 15px; font-family: sans-serif; background-color: #f9f9f9; color: #333; }
        h3 { margin-top: 0; }
        select, input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; margin-bottom: 8px; }
        .on { background-color: #4CAF50; color: white; }
        .off { background-color: #f44336; color: white; }
        .secondary { background-color: #e7e7e7; color: black; }
        .delete-btn { background-color: #ff9800; color: white; }
        .form-group { border-top: 1px solid #ddd; padding-top: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <h3>Мои Серверы</h3>
    
    <label for="serverSelect">Активный сервер:</label>
    <select id="serverSelect"></select>
    
    <div style="display: flex; gap: 5px; margin-bottom: 15px;">
        <button id="editServerBtn" class="secondary" style="margin-bottom: 0; padding: 6px; font-size: 12px;">Редактировать</button>
        <button id="deleteServerBtn" class="delete-btn" style="margin-bottom: 0; padding: 6px; font-size: 12px;">Удалить</button>
    </div>

    <button id="toggleBtn" class="off">ВКЛЮЧИТЬ ПРОКСИ</button>

    <div class="form-group">
        <h4>Параметры сервера</h4>
        <input type="text" id="newName" placeholder="Название (например, Германия)">
        <input type="text" id="newHost" placeholder="IP или домен">
        <input type="number" id="newPort" placeholder="Порт (например, 8080)">
        <input type="text" id="newUsername" placeholder="Логин">
        <input type="password" id="newPassword" placeholder="Пароль">
        <button id="addServerBtn" class="secondary">Сохранить сервер</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
